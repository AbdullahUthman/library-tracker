<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Book Tracker</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">📚 Library Book Tracker</a>
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#addBook">Add Book</a></li>
          <li class="nav-item"><a class="nav-link" href="#bookList">Books</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-4">
      <!-- Add Book Form -->
      <div class="col-12 col-md-4" id="addBook">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Add Book</div>
          <div class="card-body">
            <form id="bookForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input type="text" class="form-control" id="title" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="author">Author</label>
                <input type="text" class="form-control" id="author" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="category">Category</label>
                <input type="text" class="form-control" id="category" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="year">Year</label>
                <input type="number" class="form-control" id="year" />
              </div>
              <div id="formError" class="text-danger mb-2"></div>
              <button type="submit" class="btn btn-primary w-100">Add Book</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Book List -->
      <div class="col-12 col-md-8" id="bookList">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Books</h4>
          <select id="categoryFilter" class="form-select w-auto">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div id="books" class="row g-3"></div>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="script.js"></script>
</body>
</html>
